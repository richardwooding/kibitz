# Fly.io config for the hosted kibitz relay.
#
# The relay keeps its session registry in memory, so a machine that stops takes
# its live sessions with it — auto_stop_machines must stay off. Scaling out is
# safe: flyaffinity pins every connection for a session to one machine (see
# relay.Options.Router in cmd/kibitz), so each session has one authoritative
# relay. Keep min_machines_running equal to the machine count.

app = "kibitz-play" # "kibitz" was taken on Fly
primary_region = "jnb"

[build]
  image = "ghcr.io/richardwooding/kibitz:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # stopping the machine kills every live session
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Rolling deploy: replace one machine at a time so at most 1/N sessions churn.
# Session affinity (relay Options.Router) pins each session to one machine;
# a replaced machine's in-flight sessions recover via reconnect=rejoin. Going
# multi-node is an explicit `fly scale count N` (+ min_machines_running N).
[deploy]
  strategy = "rolling"
  max_unavailable = 1
