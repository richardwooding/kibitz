name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      # -race on a shared 2–4 core runner can starve a goroutine for tens of
      # seconds, so the heaviest integration test (battleship, ~34 encrypted
      # round-trips) needs generous headroom; 600s keeps a genuine hang bounded.
      - run: go test -race -timeout 600s ./...
      - run: go vet ./...
      - name: WASM compile check
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/kibitz-wasm
      - name: Full web build
        run: make wasm && go build ./cmd/kibitz

  # Complexity ratchet: fails a PR when a function it CHANGES exceeds the
  # cognitive threshold. Existing hotspots only fail once touched.
  complexity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff gate needs the merge-base
      - uses: richardwooding/codemetrics@v0.12.2
        with:
          max-cognitive: "15"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
